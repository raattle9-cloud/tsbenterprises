services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=TSB.settings
    # DNS configuration to ensure proper hostname resolution
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Ensure container can resolve DNS properly
    dns_search: []
    # Static files are collected during build, no volume needed
    # volumes:
    #   - static_volume:/app/staticfiles
    restart: unless-stopped

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:1::/64

